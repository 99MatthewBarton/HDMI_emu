[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hdmi-tester"
version = "0.1.0"
description = "Raspberry Pi HDMI display tester: test patterns, defect marking, EDID decoding"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "pygame"]

[project.optional-dependencies]
gpio = ["gpiozero"]
test = ["pytest"]

[project.scripts]
hdmi-tester = "hdmi_tester.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
